<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - AgriWaste</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(rgba(255,255,255,0.3), rgba(255,255,255,0.3)), 
                  url("agriwaste_full_project/images/agrilogin.png") center/cover no-repeat;
    }

    /* Floating particles animation */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: rgba(76, 175, 80, 0.6);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .particle:nth-child(1) { width: 8px; height: 8px; left: 12%; animation-delay: 0s; }
    .particle:nth-child(2) { width: 12px; height: 12px; left: 25%; animation-delay: 1s; }
    .particle:nth-child(3) { width: 6px; height: 6px; left: 38%; animation-delay: 2s; }
    .particle:nth-child(4) { width: 10px; height: 10px; left: 51%; animation-delay: 3s; }
    .particle:nth-child(5) { width: 14px; height: 14px; left: 64%; animation-delay: 4s; }
    .particle:nth-child(6) { width: 8px; height: 8px; left: 77%; animation-delay: 5s; }
    .particle:nth-child(7) { width: 12px; height: 12px; left: 86%; animation-delay: 0.5s; }
    .particle:nth-child(8) { width: 6px; height: 6px; left: 93%; animation-delay: 1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    .forgot-container {
      background: rgba(255,255,255,0.95);
      padding: 40px 35px;
      border-radius: 15px;
      width: 370px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      position: relative;
      z-index: 1;
      animation: slideIn 0.9s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h2 {
      color: #2e7d32;
      margin-bottom: 20px;
    }

    p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4caf50;
      box-shadow: 0 0 6px rgba(76,175,80,0.4);
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #4caf50, #81c784);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: linear-gradient(90deg, #388e3c, #66bb6a);
      transform: translateY(-2px);
    }

    .links {
      margin-top: 18px;
      font-size: 14px;
    }

    .links a {
      color: #2e7d32;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body data-i18n-title="forgot_page_title">
  <!-- Floating particles background -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="forgot-container">
    <h2 data-i18n="forgot_h2">Forgot Password?</h2>
    <p data-i18n="forgot_p">Enter your registered email address to reset your password</p>
    <form id="forgotForm">
      <input type="email" name="email" placeholder="Enter your email" data-i18n-placeholder="forgot_email_placeholder" required>
      <button type="submit" data-i18n="forgot_submit_btn">Send Reset Link</button>
    </form>
    <p id="forgotStatus" role="status" aria-live="polite"></p>
    <div class="links">
      <a href="index.html" data-i18n="forgot_back_login">⬅ Back to Login</a>
    </div>
  </div>
  <script src="./i18n.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function(event) {
      event.preventDefault();
      document.getElementById('forgotStatus').textContent =
        window.I18N.t('forgot_local_only');
    });
  </script>
</body>
</html>
