<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sell Waste - AgriWaste</title>
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script>
    if (new URLSearchParams(window.location.search).get('embed') === '1') {
      document.documentElement.classList.add('embed-mode');
    }
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f2f7f2;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(135deg, #4caf50, #81c784);
      color: white;
      text-align: center;
      padding: 50px 20px 30px 20px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }

    header .site-tag {
      margin-top: 8px;
      font-size: 1.1rem;
    }

    nav {
      background: #43a047;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    nav a:hover, nav a.active {
      text-decoration: underline;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.85);
      z-index: 1;
    }

    html.embed-mode body > header,
    html.embed-mode body > nav,
    html.embed-mode body > footer {
      display: none !important;
    }

    html.embed-mode body > .container {
      max-width: 100%;
      margin: 0;
      padding: 24px;
      border-radius: 0;
      box-shadow: none;
      background: #fff;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=800&q=60') center/cover no-repeat;
      opacity: 0.15;
      z-index: -1;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #2e7d32;
    }

    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
      gap: 10px;
    }

    .form-row label {
      flex: 0 0 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-row input, .form-row select {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: 0.3s;
      background: white;
    }

    .form-row input[type="file"] {
      min-width: 0;
    }

    .form-row .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #imageHint, #responseMsg {
      text-align: center;
      color: #555;
    }

    #wasteImagePreview, #receipt-waste-image {
      display: block;
      max-width: 100%;
      max-height: 240px;
      margin: 12px auto;
      border-radius: 8px;
      object-fit: contain;
    }

    #wasteImagePreview[hidden], #receipt-waste-image[hidden] {
      display: none;
    }

    .form-row input:focus, .form-row select:focus {
      outline: none;
      border-color: #4caf50;
      box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
    }

    button.primary {
      background: #4caf50;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }

    button.primary:hover {
      background: #388e3c;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      background: #43a047;
      color: white;
      padding: 12px;
      margin-top: 40px;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    @media (max-width: 650px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
    }

    .icon {
      width: 24px;
      height: 24px;
      fill: #4caf50;
    }

    .leaf {
      position: absolute;
      width: 30px;
      height: 30px;
      background: url('https://cdn-icons-png.flaticon.com/512/427/427735.png') no-repeat center/contain;
      opacity: 0.6;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0.6;
      }
      50% {
        transform: translateY(300px) rotate(180deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(650px) rotate(360deg);
        opacity: 0.6;
      }
    }

    /* Receipt styles */
    #receipt {
      display: none;
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 2px solid #4caf50;
    }

    .receipt-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px dashed #4caf50;
    }

    .receipt-header h3 {
      margin: 0;
      color: #2e7d32;
      font-size: 1.5rem;
    }

    .receipt-details {
      margin-bottom: 20px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dotted #ddd;
    }

    .receipt-label {
      font-weight: bold;
      color: #555;
    }

    .receipt-value {
      color: #333;
    }

    .receipt-total {
      font-weight: bold;
      font-size: 1.2rem;
      color: #2e7d32;
      margin-top: 15px;
      padding-top: 10px;
      border-top: 2px solid #4caf50;
    }

    .receipt-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    button.secondary {
      background: #81c784;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    button.secondary:hover {
      background: #66bb6a;
    }
  </style>
</head>
<body data-i18n-title="sell_page_title">
  <header>
    <h1 data-i18n="sell_header_title">Sell Your AgriWaste</h1>
    <div class="site-tag" data-i18n="sell_header_tag">List your agricultural waste for buyers to see</div>
  </header>

  <main class="container">
    <h2 data-i18n="sell_main_title">Sell Waste Form</h2>

    <form id="sellForm">
      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
          </svg>
        </label>
        <label class="sr-only" for="farmerName" data-i18n="sell_name_label">Full name</label>
        <input id="farmerName" type="text" name="farmer_name" placeholder="Your full name" data-i18n-placeholder="sell_name_placeholder" autocomplete="name" required>
      </div>

      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </label>
        <label class="sr-only" for="sellEmail" data-i18n="sell_email_label">Email address</label>
        <input id="sellEmail" type="email" name="email" placeholder="you@example.com" data-i18n-placeholder="sell_email_placeholder" autocomplete="email" required>
      </div>

      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.32.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.26.2 2.46.57 3.58a1 1 0 01-.24 1.02L6.6 10.8z"/>
          </svg>
        </label>
        <label class="sr-only" for="sellPhone" data-i18n="sell_phone_label">Phone number</label>
        <input id="sellPhone" type="tel" name="phone" placeholder="Phone number" data-i18n-placeholder="sell_phone_placeholder" autocomplete="tel" pattern="(?:[0-9]|\+|\(|\)|\s|\.|-){7,20}" required>
      </div>

      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M3 21V3h18v18H3zm2-2h3v-4H5v4zm0-6h3V9H5v4zm0-6h3V5H5v2zm5 12h4v-4h-4v4zm0-6h4V9h-4v4zm0-6h4V5h-4v2zm6 12h3v-4h-3v4zm0-6h3V9h-3v4zm0-6h3V5h-3v2z"/>
          </svg>
        </label>
        <label class="sr-only" for="sellCompany" data-i18n="sell_company_label">Company</label>
        <select id="sellCompany" name="company" required>
          <option value="" data-i18n="sell_company_placeholder">Select Company</option>
        </select>
      </div>

      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 2C6.5 2 2 6.5 2 12c0 5.5 4.5 10 10 10s10-4.5 10-10C22 6.5 17.5 2 12 2zm0 2c4.4 0 8 3.6 8 8 0 1.5-.4 2.9-1.1 4.1L7.9 5.1C9.1 4.4 10.5 4 12 4z"/>
          </svg>
        </label>
        <label class="sr-only" for="wasteType" data-i18n="sell_waste_type_label">Waste type</label>
        <select id="wasteType" name="waste_type" required>
          <option data-i18n="product_rice_straw">Rice Straw</option>
          <option data-i18n="product_sugarcane_bagasse">Sugarcane Bagasse</option>
          <option data-i18n="product_coconut_husk">Coconut Husk</option>
          <option data-i18n="product_compost_material">Compost Material</option>
          <option data-i18n="product_wheat_straw">Wheat Straw</option>
          <option data-i18n="product_banana_fiber_waste">Banana Fiber Waste</option>
          <option data-i18n="product_corn_cobs">Corn Cobs</option>
          <option data-i18n="product_peanut_shells">Peanut Shells</option>
          <option data-i18n="product_fruit_waste">Fruit Waste</option>
          <option data-i18n="product_tea_waste">Tea Waste</option>
          <option data-i18n="product_bamboo_waste">Bamboo Waste</option>
          <option data-i18n="product_cotton_stalks">Cotton Stalks</option>
          <option data-i18n="product_mango_seed_waste">Mango Seed Waste</option>
          <option data-i18n="product_sawdust">Sawdust</option>
          <option data-i18n="product_mustard_husk">Mustard Husk</option>
          <option data-i18n="product_other">Other</option>
        </select>
      </div>

      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M3 3h18v2H3V3zm0 4h12v2H3V7zm0 4h18v2H3v-2zm0 4h12v2H3v-2zm0 4h18v2H3v-2z"/>
          </svg>
        </label>
        <label class="sr-only" for="sellQuantity" data-i18n="sell_quantity_label">Quantity in tons</label>
        <input id="sellQuantity" type="number" name="quantity" min="0.1" step="0.1" placeholder="Quantity in tons" data-i18n-placeholder="sell_qty_placeholder" required>
      </div>

      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 1C5.9 1 1 5.9 1 12s4.9 11 11 11 11-4.9 11-11S18.1 1 12 1zm1 17h-2v-2h2v2zm0-4h-2V7h2v7z"/>
          </svg>
        </label>
        <label class="sr-only" for="sellPrice" data-i18n="sell_price_label">Price per ton</label>
        <input id="sellPrice" type="number" name="price" min="0" step="1" placeholder="Price per ton" data-i18n-placeholder="sell_price_placeholder" required>
      </div>

      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 2C8.1 2 5 5.1 5 9c0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7zm0 9.5c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.5 12 6.5s2.5 1.1 2.5 2.5S13.4 11.5 12 11.5z"/>
          </svg>
        </label>
        <label class="sr-only" for="sellLocation" data-i18n="sell_location_label">Location</label>
        <input id="sellLocation" type="text" name="location" placeholder="Village / Town / District" data-i18n-placeholder="sell_location_placeholder">
      </div>

      <div class="form-row">
        <label aria-hidden="true">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M21 19V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2zM8.5 11A2.5 2.5 0 118.5 6a2.5 2.5 0 010 5zM5 19l4.5-6 3.5 4.5 2.5-3L19 19H5z"/>
          </svg>
        </label>
        <label class="sr-only" for="wasteImage" data-i18n="sell_image_label">Waste photo</label>
        <input id="wasteImage" type="file" name="waste_image" accept="image/*" aria-describedby="imageHint">
      </div>
      <p id="imageHint" data-i18n="sell_image_hint">Add a photo of your agricultural waste (optional)</p>
      <img id="wasteImagePreview" alt="Selected waste photo preview" data-i18n-alt-attr="sell_image_alt" hidden>

      <div style="text-align:center; margin-top:12px;">
        <button class="primary" type="submit" data-i18n="sell_submit_btn">Submit Listing</button>
      </div>
    </form>
    
    <p id="responseMsg" role="status" aria-live="polite"></p>
    <div style="text-align:center;">
      <button id="new-listing" class="secondary" type="button" data-i18n="sell_new_listing" hidden>Create another listing</button>
    </div>

  </main>

  <div class="leaf" style="left: 10%; animation-duration:12s;"></div>
  <div class="leaf" style="left: 30%; animation-duration:15s;"></div>
  <div class="leaf" style="left: 50%; animation-duration:10s;"></div>
  <div class="leaf" style="left: 70%; animation-duration:18s;"></div>
  <div class="leaf" style="left: 85%; animation-duration:14s;"></div>

  <footer><span data-i18n="footer_copyright">© 2026 AgriWaste Marketplace</span></footer>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // Form elements
    const sellForm = document.getElementById("sellForm");
    const companySelect = document.getElementById("sellCompany");

    // PHP file paths
    const buyersURL = "http://localhost:8081/mypro/trial/get_buyers.php";
    const saveWasteURL = "http://localhost:8081/mypro/trial/agriwaste_full_project/save_waste.php";

    // Load all registered buyers into the dropdown
    async function loadBuyers() {
        companySelect.innerHTML =
            '<option value="">Loading companies...</option>';

        try {
            const response = await fetch(buyersURL);
            const responseText = await response.text();

            console.log("Buyers API HTTP status:", response.status);
            console.log("Buyers API response:", responseText);

            if (!response.ok) {
                throw new Error("HTTP " + response.status + ": " + responseText);
            }

            let data;

            try {
                data = JSON.parse(responseText);
            } catch (error) {
                throw new Error(
                    "The PHP file did not return valid JSON. Check get_buyers.php for PHP errors."
                );
            }

            if (data.success !== true) {
                throw new Error(data.message || "Could not load registered buyers.");
            }

            companySelect.innerHTML = "";

            const defaultOption = document.createElement("option");
            defaultOption.value = "";
            defaultOption.textContent = "Select Company";
            defaultOption.disabled = true;
            defaultOption.selected = true;
            companySelect.appendChild(defaultOption);

            if (!Array.isArray(data.buyers) || data.buyers.length === 0) {
                companySelect.innerHTML =
                    '<option value="">No registered buyers found</option>';
                console.warn("No buyers were returned by the PHP endpoint.");
                return;
            }

            data.buyers.forEach(function (buyer) {
                const option = document.createElement("option");

                // Buyer ID is submitted to PHP
                option.value = buyer.id;

                // Buyer's name appears in the dropdown
                option.textContent = buyer.full_name;

                companySelect.appendChild(option);
            });

            console.log("Registered buyers loaded:", data.buyers.length);

        } catch (error) {
            console.error("Error loading companies:", error);

            companySelect.innerHTML =
                '<option value="">Unable to load companies</option>';
        }
    }

    // Submit Sell Waste form
    if (sellForm) {
        sellForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!companySelect.value) {
                alert("Please select a company.");
                companySelect.focus();
                return;
            }

            const submitButton = sellForm.querySelector(
                'button[type="submit"], input[type="submit"]'
            );

            if (submitButton) {
                submitButton.disabled = true;
            }

            try {
                const formData = new FormData(sellForm);

                const response = await fetch(saveWasteURL, {
                    method: "POST",
                    body: formData
                });

                const responseText = await response.text();

                console.log("Save waste HTTP status:", response.status);
                console.log("Save waste response:", responseText);

                if (!response.ok) {
                    throw new Error("HTTP " + response.status + ": " + responseText);
                }

                let result;

                try {
                    result = JSON.parse(responseText);
                } catch (error) {
                    throw new Error(
                        "save_waste.php did not return valid JSON."
                    );
                }

                if (result.success === true) {
                    alert(result.message || "Waste listing submitted successfully!");

                    sellForm.reset();

                    // Reload the buyers dropdown after resetting the form
                    await loadBuyers();
                } else {
                    alert(result.message || "Unable to save waste listing.");
                }

            } catch (error) {
                console.error("Error submitting waste listing:", error);
                alert("Error submitting waste listing. Check the browser console and PHP response.");
            } finally {
                if (submitButton) {
                    submitButton.disabled = false;
                }
            }
        });
    } else {
        console.error('Form with id="sellForm" was not found.');
    }

    // Load buyers when the page opens
    if (companySelect) {
        loadBuyers();
    } else {
        console.error('Dropdown with id="sellCompany" was not found.');
    }

});
</script>


  <script src="../i18n.js"></script>
</body>
</html>
