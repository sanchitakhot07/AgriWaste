<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Thank You - AgriWaste</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .thankyou-container {
      text-align: center;
      margin-top: 100px;
    }
    .thankyou-container h1 {
      font-size: 36px;
      color: #28a745;
    }
    .thankyou-container p {
      font-size: 20px;
      color: #555;
    }
    .thankyou-container a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
    .thankyou-container a:hover {
      background: #0056b3;
    }
  </style>
</head>
<body data-i18n-title="thankyou_page_title">
  <div class="thankyou-container">
    <h1 data-i18n="thankyou_h1">Thank You!</h1>
    <p id="tyMsg" data-i18n="thankyou_p">Your listing has been received successfully.</p>
    <a href="marketplace.html" data-i18n="thankyou_to_market">Go to Marketplace</a>
  </div>
  <script src="../i18n.js"></script>
</body>
</html>
