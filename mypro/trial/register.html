<!-- =========================
     REGISTER BOX

<div class="container" id="registerBox">

    <div class="logo">
        🌱
        <span>AgriWaste Marketplace</span>
    </div>

    <h2 data-i18n="register_title">
        Create Your Account
    </h2>


    <!-- REGISTER FORM -->

    <form id="registerForm">

        <!-- Full Name -->

        <div class="input-group">

            <i class="fa fa-user"></i>

            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Full Name"
                data-i18n-placeholder="fullname_placeholder"
                required
            >

        </div>


        <!-- Email -->

        <div class="input-group">

            <i class="fa fa-envelope"></i>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                data-i18n-placeholder="email_placeholder"
                required
            >

        </div>


        <!-- Username -->

        <div class="input-group">

            <i class="fa fa-id-badge"></i>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                data-i18n-placeholder="username_placeholder"
                required
            >

        </div>


        <!-- Password -->

        <div class="input-group">

            <i class="fa fa-lock"></i>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                data-i18n-placeholder="password_placeholder"
                required
            >

        </div>


        <!-- Confirm Password -->

        <div class="input-group">

            <i class="fa fa-lock"></i>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                data-i18n-placeholder="confirm_password_placeholder"
                required

        </div>


        <!-- User Type -->

        <div class="input-group">

            <i class="fa fa-users"></i>

            <select

                    Select User Type

                <option
                    value="farmer"

                    farmer

<!-- =========================
     REGISTRATION JAVASCRIPT
========================== -->
<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("registerForm");
    const resultDiv = document.getElementById("result");
    const registerButton = document.getElementById("registerSubmit");

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        // =========================
        // GET FORM VALUES
        // =========================

        const full_name = document.getElementById("fullname").value.trim();

        const email = document.getElementById("email").value.trim();

        const username = document.getElementById("username").value.trim();

        const password = document.getElementById("password").value;

        const confirm_password =
            document.getElementById("confirm_password").value;

        const user_type =
            document.getElementById("user_type").value.trim();

        const phone_no =
            document.getElementById("phone").value.trim();


        // =========================
        // CLEAR MESSAGE
        // =========================

        resultDiv.textContent = "";
        resultDiv.style.color = "";


        // =========================
        // PASSWORD CHECK
        // =========================

        if (password !== confirm_password) {

            resultDiv.textContent =
                "Passwords do not match.";

            resultDiv.style.color = "#b00020";

            return;
        }


        // =========================
        // EMPTY FIELD CHECK
        // =========================

        if (
            full_name === "" ||
            email === "" ||
            username === "" ||
            password === "" ||
            user_type === "" ||
            phone_no === ""
        ) {

            resultDiv.textContent =
                "Please fill all fields.";

            resultDiv.style.color = "#b00020";

            return;
        }


        // =========================
        // USER TYPE CHECK
        // =========================

        if (
            user_type !== "farmer" &&
            user_type !== "buyer"
        ) {

            resultDiv.textContent =
                "Invalid user type. Please select Farmer or Buyer.";

            resultDiv.style.color = "#b00020";

            return;
        }


        // =========================
        // EMAIL CHECK
        // =========================

        const emailPattern =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {

            resultDiv.textContent =
                "Please enter a valid email address.";

            resultDiv.style.color = "#b00020";

            return;
        }


        // =========================
        // PHONE CHECK
        // =========================

        const phonePattern = /^[0-9]{10}$/;

        if (!phonePattern.test(phone_no)) {

            resultDiv.textContent =
                "Please enter a valid 10-digit phone number.";

            resultDiv.style.color = "#b00020";

            return;
        }


        // =========================
        // DISABLE BUTTON
        // =========================

        registerButton.disabled = true;
        registerButton.textContent = "Registering...";


        // =========================
        // CREATE DATA
        // =========================

        const registrationData = {
            full_name: full_name,
            email: email,
            username: username,
            password: password,
            user_type: user_type,
            phone_no: phone_no
        };


        // =========================
        // DEBUG
        // =========================

        console.log(
            "User Type Being Sent:",
            user_type
        );

        console.log(
            "Registration Data:",
            registrationData
        );


        // =========================
        // SEND TO PHP
        // =========================

        try {

            const response = await fetch(
                "http://localhost:8081/mypro/trial/register.php",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(registrationData)
                }
            );


            // =========================
            // CHECK RESPONSE
            // =========================

            if (!response.ok) {

                throw new Error(
                    "Server error: " + response.status
                );
            }


            // =========================
            // GET JSON RESPONSE
            // =========================

            const data = await response.json();

            console.log(
                "PHP Response:",
                data
            );


            // =========================
            // SUCCESS
            // =========================

            if (data.success === true) {

                resultDiv.textContent =
                    data.message ||
                    "Registration successful!";

                resultDiv.style.color = "#2e7d32";


                setTimeout(function () {

                    document.getElementById(
                        "registerBox"
                    ).style.display = "none";


                    document.getElementById(
                        "successBox"
                    ).style.display = "block";

                }, 500);

            }


            // =========================
            // PHP ERROR
            // =========================

            else {

                resultDiv.textContent =
                    data.message ||
                    "Registration failed.";

                resultDiv.style.color = "#b00020";

                registerButton.disabled = false;

                registerButton.textContent = "Register";
            }

        }


        // =========================
        // CONNECTION ERROR
        // =========================

        catch (error) {

            console.error(
                "Registration Error:",
                error
            );

            resultDiv.textContent =
                "Unable to connect to server. " +
                "Please make sure XAMPP Apache " +
                "and MySQL are running.";

            resultDiv.style.color = "#b00020";

            registerButton.disabled = false;

            registerButton.textContent = "Register";
        }

    });

});

</script>
